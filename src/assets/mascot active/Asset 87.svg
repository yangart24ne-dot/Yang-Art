<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_2" data-name="Layer 2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 141.22 170.09">
  <defs>
    <style>
      .cls-1 {
        fill: #fff;
      }

      .cls-2 {
        fill: blue;
      }

      .cls-3 {
        fill: #a7f417;
      }

      .cls-4 {
        fill: #ff009c;
      }

      .cls-5 {
        fill: #052afa;
      }

      @keyframes glanceEye {
        0%, 5% {
          transform: translate(0px, 0px) scale(1);
        }
        15%, 33% {
          transform: translate(-4.8px, -0.6px) scale(1);
        }
        43%, 61% {
          transform: translate(4.8px, -0.6px) scale(1);
        }
        69% {
          transform: translate(0px, 0px) scale(1);
        }
        /* Chớp mắt (Quick cute blink) */
        73% {
          transform: translate(0px, 0px) scaleY(0.08) scaleX(1.08);
        }
        /* Mở to mắt và Bling! */
        77% {
          transform: translate(0px, 0px) scale(1.12);
        }
        88% {
          transform: translate(0px, 0px) scale(1.05);
        }
        95%, 100% {
          transform: translate(0px, 0px) scale(1);
        }
      }

      @keyframes glanceBrows {
        0%, 5% {
          transform: translate(0px, 0px) rotate(0deg);
        }
        15%, 33% {
          transform: translate(-3.6px, -0.4px) rotate(-4deg);
        }
        43%, 61% {
          transform: translate(3.6px, -0.4px) rotate(4deg);
        }
        69% {
          transform: translate(0px, 0px) rotate(0deg);
        }
        /* Chớp mắt -> chân mày hạ */
        73% {
          transform: translate(0px, 1.8px) rotate(0deg);
        }
        /* Mở mắt bling -> chân mày nhướng lên hào hứng */
        77%, 88% {
          transform: translate(0px, -2.5px) rotate(0deg);
        }
        95%, 100% {
          transform: translate(0px, 0px) rotate(0deg);
        }
      }

      @keyframes starBling {
        0%, 72% {
          opacity: 0;
          transform: translate(60px, 28px) scale(0) rotate(0deg);
        }
        76% {
          opacity: 1;
          transform: translate(60px, 28px) scale(0.3) rotate(30deg);
        }
        81% {
          opacity: 1;
          transform: translate(60px, 28px) scale(1.3) rotate(80deg);
        }
        87% {
          opacity: 1;
          transform: translate(60px, 28px) scale(1.0) rotate(120deg);
        }
        93% {
          opacity: 0.7;
          transform: translate(60px, 28px) scale(0.4) rotate(160deg);
        }
        96%, 100% {
          opacity: 0;
          transform: translate(60px, 28px) scale(0) rotate(180deg);
        }
      }

      @keyframes starMiniBling {
        0%, 75% {
          opacity: 0;
          transform: translate(67px, 21px) scale(0) rotate(0deg);
        }
        80% {
          opacity: 1;
          transform: translate(67px, 21px) scale(1.25) rotate(45deg);
        }
        88% {
          opacity: 1;
          transform: translate(67px, 21px) scale(0.85) rotate(90deg);
        }
        94%, 100% {
          opacity: 0;
          transform: translate(67px, 21px) scale(0) rotate(135deg);
        }
      }

      .anim-eyebrows {
        transform-box: fill-box;
        transform-origin: center bottom;
        animation: glanceBrows 3.8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }

      .anim-eye {
        transform-box: fill-box;
        transform-origin: center;
        animation: glanceEye 3.8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }

      .anim-star {
        transform-origin: 0 0;
        animation: starBling 3.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .anim-star-mini {
        transform-origin: 0 0;
        animation: starMiniBling 3.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
    </style>
  </defs>
