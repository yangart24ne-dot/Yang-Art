<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_2" data-name="Layer 2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 724.85 611.72">
  <defs>
    <style>
      .cls-1, .cls-2, .cls-3, .cls-4 {
        stroke: blue;
        stroke-miterlimit: 10;
      }

      .cls-1, .cls-5 {
        fill: #ff009b;
      }

      .cls-6, .cls-4 {
        fill: #fff;
      }

      .cls-2 {
        fill: none;
      }

      .cls-7 {
        fill: blue;
      }

      .cls-3 {
        fill: #a6f317;
      }

      .cls-8 {
        fill: #a7f417;
      }

      /* Mascot Eye Animation (Glance + Blink, no bling) */
      @keyframes glancePupil43 {
        0%, 8% {
          transform: translate(0px, 0px);
        }
        18%, 34% {
          transform: translate(-16px, -2px);
        }
        44%, 60% {
          transform: translate(16px, -2px);
        }
        68%, 100% {
          transform: translate(0px, 0px);
        }
      }

      @keyframes blinkEye43 {
        0%, 70% {
          transform: scaleY(1) scaleX(1);
        }
        73% {
          transform: scaleY(0.08) scaleX(1.08);
        }
        77% {
          transform: scaleY(1.08) scaleX(0.96);
        }
        82%, 100% {
          transform: scaleY(1) scaleX(1);
        }
      }

      .anim-mascot-eye {
        transform-origin: 248px 83px;
        animation: blinkEye43 3.8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }

      .anim-mascot-pupil {
        animation: glancePupil43 3.8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }

      /* Water Bottles Wobble (Chai nước lắc nhẹ) */
      @keyframes bottleWobble1 {
        0%, 100% {
          transform: rotate(0deg) translate3d(0, 0, 0);
        }
        50% {
          transform: rotate(2.2deg) translate3d(-1px, -3px, 0);
        }
      }

      @keyframes bottleWobble2 {
        0%, 100% {
          transform: rotate(0deg) translate3d(0, 0, 0);
        }
        50% {
          transform: rotate(-2.4deg) translate3d(1px, -3.5px, 0);
        }
      }

      @keyframes bottleWobble3 {
        0%, 100% {
          transform: rotate(0deg) translate3d(0, 0, 0);
        }
        50% {
          transform: rotate(1.8deg) translate3d(-1px, -2.5px, 0);
        }
      }

      .anim-bottle-1 {
        transform-origin: 348px 240px;
        animation: bottleWobble1 2.8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }

      .anim-bottle-2 {
        transform-origin: 520px 240px;
        animation: bottleWobble2 3.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite -0.7s;
      }

      .anim-bottle-3 {
        transform-origin: 420px 300px;
        animation: bottleWobble3 2.9s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite -1.4s;
      }

      .anim-bottle-4 {
        transform-origin: 600px 320px;
        animation: bottleWobble1 3.1s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite -2.1s;
      }

      .anim-bottle-5 {
        transform-origin: 490px 330px;
        animation: bottleWobble2 3.0s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite -1.0s;
      }

      /* Water Droplets Hover & Shake (Giọt nước bập bênh / lắc nhẹ) */
      @keyframes dropletFloat1 {
        0%, 100% {
          transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
        }
        50% {
          transform: translate3d(0, -6px, 0) rotate(4deg) scale(1.05);
        }
      }

      @keyframes dropletFloat2 {
        0%, 100% {
          transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
        }
        50% {
          transform: translate3d(0, -7px, 0) rotate(-5deg) scale(1.06);
        }
      }

      @keyframes dropletFloat3 {
        0%, 100% {
          transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
        }
        50% {
          transform: translate3d(0, -5px, 0) rotate(3.5deg) scale(1.04);
        }
      }

      .anim-droplet-1 {
        transform-origin: 480px 45px;
        animation: dropletFloat1 2.4s ease-in-out infinite;
      }

      .anim-droplet-2 {
        transform-origin: 615px 30px;
        animation: dropletFloat2 2.6s ease-in-out infinite -0.8s;
      }

      .anim-droplet-3 {
        transform-origin: 650px 60px;
        animation: dropletFloat3 2.2s ease-in-out infinite -1.5s;
      }
    </style>
  </defs>
